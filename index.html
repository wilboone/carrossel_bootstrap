<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrossel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      .titulo {
        position: relative;
      }
      .titulo::after {
        content: "";

        position: absolute;

        bottom: 0;
        left: 50%;

        transform: translateX(-50%);

        width: 60%;

        height: 2px;

        background: #000e1a;
      }
    </style>
  </head>
  <body
    class="d-flex flex-column justify-content-center align-items-center vh-100"
  >
    <h1 class="text-center titulo" style="color: #000e1a">Nossos Clientes</h1>

    <div
      class="shadow border-0 rounded d-flex flex-column align-items-center mx-auto mt-4"
      style="background-color: #eff8ff; max-width: 40rem"
    >
      <div class="border-0 rounded d-flex flex-column align-items-center">
        <img
          src="p4.jpg"
          alt=""
          class="d-block mx-auto mt-4 mb-4 shadow"
          style="
            height: 9rem;
            width: 9rem;
            object-fit: cover;
            border-radius: 50%;
          "
        />
        <h4 class="nome fw-bold" style="color: #000e1a">Sara Jones</h4>
        <p
          class="depoimento text-center w-50 d-block mb-3 mt-2 fw-normal"
          style="color: #002440"
        >
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam
          consectetur exercitationem sit quidem omnis molestiae tempore eius
          suscipit maiores modi assumenda mollitia soluta reiciendis nobis
          placeat in, animi cum debitis!
        </p>
      </div>
      <div class="mb-4 mt-2 d-flex gap-3">
        <button class="btn btn-primary fw-light" style="color: #000e1a">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            style="height: 1.2rem; color: #000e1a"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 19.5 8.25 12l7.5-7.5"
            />
          </svg>
          Anterior
        </button>
        <button class="btn btn-primary fw-light" style="color: #000e1a">
          Próximo
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
            style="height: 1.2rem; color: #000e1a"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m8.25 4.5 7.5 7.5-7.5 7.5"
            />
          </svg>
        </button>
      </div>
    </div>
  </body>
</html>
